apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-test
  labels:
    app: hello-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-test
  template:
    metadata:
      labels:
        app: hello-test
    spec:
      containers:
      - name: hello-test
        image: hello-test
        imagePullPolicy: Never
        env:
          - name: "NODE_ID"
            value: "node1"
        ports:
        - containerPort: 8082